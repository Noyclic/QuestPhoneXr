<text x="54" y="101" fill="#F2FFFC" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Hand tracking</text>
<text x="54" y="130" fill="#9BC6C5" font-family="Inter,Arial,sans-serif" font-size="14">Camera frames become hand landmarks and approximate gesture input.</text>
