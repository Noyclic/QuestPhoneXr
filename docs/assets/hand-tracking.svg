<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" fill="none" role="img" aria-labelledby="title desc">
<title id="title">GVXRS optional hand tracking</title><desc id="desc">A smartphone camera observes a hand while an illustrative landmark skeleton is shown with a privacy-first tracking status panel.</desc>
