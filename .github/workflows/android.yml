name: Android CI — build, unit tests and emulator smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questphonexr-android-${{ github.ref }}
  # Do not kill a running emulator validation when another agent pushes a newer commit.
  # GitHub keeps one active run and queues the newest pending run.
  cancel-in-progress: false

jobs:
  android-ci:
    name: Build, test and launch on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source snapshot
        run: |
          set -euo pipefail
          mkdir -p source-archive
          git archive --format=zip --prefix=QuestPhoneXR/ --output=source-archive/QuestPhoneXR-source.zip HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run isolated GVXRS Rust core tests
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable test --manifest-path gvxrs-core/Cargo.toml --all-targets

      - name: Run native EndXR core tests
        run: |
          set -euo pipefail
          mkdir -p ci-results
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            app/src/test/cpp/endxr_runtime_core_test.cpp \
            app/src/main/cpp/endxr_runtime_core.cpp \
            -o ci-results/endxr-runtime-core-tests
          ci-results/endxr-runtime-core-tests

      - name: Run native OpenXR bootstrap tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            -I app/src/main/cpp/third_party/openxr/include \
            app/src/test/cpp/endxr_openxr_runtime_test.cpp \
            app/src/main/cpp/endxr_openxr_runtime.cpp \
            -o ci-results/endxr-openxr-runtime-tests
          ci-results/endxr-openxr-runtime-tests

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build external runtime client probe APK
        run: gradle --no-daemon :runtime-client-probe:assembleDebug

      - name: Test and build EndVR Android client
        run: |
          gradle --no-daemon :endvr-client:testDebugUnitTest
          gradle --no-daemon :endvr-client:assembleDebug

      - name: Validate EndVR client APK
        run: |
          set -euo pipefail
          APK="endvr-client/build/outputs/apk/debug/endvr-client-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee ci-results/endvr-client-metadata.txt
          grep -q "package: name='com.noyclic.endvr.client'" ci-results/endvr-client-metadata.txt

      - name: Validate APK package and required payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p ci-results
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee ci-results/apk-metadata.txt
          grep -q "package: name='com.noyclic.questphonexr'" ci-results/apk-metadata.txt

          APK_FILES="$(unzip -Z1 "$APK")"
          grep -qx "assets/hand_landmarker.task" <<< "$APK_FILES"
          grep -qx "lib/arm64-v8a/libquestphonexr_native.so" <<< "$APK_FILES"
          grep -qx "lib/arm64-v8a/libendxr_openxr.so" <<< "$APK_FILES"
          echo "APK package, MediaPipe model, JNI library and OpenXR runtime library are present." | tee ci-results/apk-validation.txt

      - name: Enable KVM for Android emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run navigation and OpenXR runtime smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash .github/scripts/run-android-emulator-smoke.sh

      - name: Upload emulator screenshots, logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhoneXR-CI-diagnostics
          path: |
            ci-results/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            runtime-client-probe/build/reports/androidTests/connected/**
            runtime-client-probe/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload external runtime client probe APK
        if: always() && !cancelled() && hashFiles('runtime-client-probe/build/outputs/apk/debug/runtime-client-probe-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhoneXR-external-client-probe-apk
          path: runtime-client-probe/build/outputs/apk/debug/runtime-client-probe-debug.apk
          if-no-files-found: warn
          retention-days: 14

      # Emulator startup is flaky on hosted runners. Keep the APK available
      # whenever the build and validation steps produced it, even if the
      # later connected-device smoke test fails.
      - name: Upload debug APK
        if: always() && !cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhoneXR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload EndVR Android client APK
        if: always() && !cancelled() && hashFiles('endvr-client/build/outputs/apk/debug/endvr-client-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: EndVR-Android-Client-APK
          path: endvr-client/build/outputs/apk/debug/endvr-client-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload source archive
        if: always() && !cancelled() && hashFiles('source-archive/QuestPhoneXR-source.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhoneXR-source-archive
          path: source-archive/QuestPhoneXR-source.zip
          if-no-files-found: error
          retention-days: 14
