name: Android CI — build, unit tests and emulator smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questphonexr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: Build, test and launch on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run native EndXR core tests
        run: |
          set -euo pipefail
          mkdir -p ci-results
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            app/src/test/cpp/endxr_runtime_core_test.cpp \
            app/src/main/cpp/endxr_runtime_core.cpp \
            -o ci-results/endxr-runtime-core-tests
          ci-results/endxr-runtime-core-tests

      - name: Run native OpenXR bootstrap tests
        run: |
          set -euo pipefail
          c++ -std=c++17 -pthread -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            -I app/src/main/cpp/third_party/openxr/include \
            app/src/test/cpp/endxr_openxr_runtime_test.cpp \
            app/src/main/cpp/endxr_openxr_runtime.cpp \
            -o ci-results/endxr-openxr-runtime-tests
          ci-results/endxr-openxr-runtime-tests

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate APK package and required payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p ci-results
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee ci-results/apk-metadata.txt
          grep -q "package: name='com.noyclic.questphonexr'" ci-results/apk-metadata.txt

          APK_FILES="$(unzip -Z1 "$APK")"
          grep -qx "assets/hand_landmarker.task" <<< "$APK_FILES"
          grep -qx "lib/arm64-v8a/libquestphonexr_native.so" <<< "$APK_FILES"
          grep -qx "lib/arm64-v8a/libendxr_openxr.so" <<< "$APK_FILES"
          echo "APK package, MediaPipe model, JNI library and OpenXR runtime library are present." | tee ci-results/apk-validation.txt

      - name: Run navigation smoke test on Android emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu off -noaudio -no-boot-anim -camera-back none -camera-front none -memory 4096 -cores 4
          script: |
            set -eu
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest
            test_exit=$?

            mkdir -p ci-results/screenshots
            adb logcat -b all -d -v threadtime > ci-results/emulator-logcat.txt
            grep -Ei 'endxr|vulkan|OpenGLRenderer|FATAL EXCEPTION|Fatal signal|DEBUG   :' ci-results/emulator-logcat.txt > ci-results/endxr-native-filtered.log || true


            adb pull /sdcard/Android/data/com.noyclic.questphonexr/files/ci-screenshots/. ci-results/screenshots/ || true

            if [ -d app/build/reports/androidTests/connected ]; then
              cp -R app/build/reports/androidTests/connected ci-results/
            fi
            if [ -d app/build/outputs/androidTest-results/connected ]; then
              cp -R app/build/outputs/androidTest-results/connected ci-results/
            fi

            exit "$test_exit"

      - name: Upload emulator screenshots, logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhoneXR-CI-diagnostics
          path: |
            ci-results/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QuestPhoneXR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
