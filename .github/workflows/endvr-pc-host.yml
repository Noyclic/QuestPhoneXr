name: EndVR PC Host

on:
  push:
    branches: [main]
    paths:
      - "pc/endvr-host/**"
      - ".github/workflows/endvr-pc-host.yml"
  pull_request:
    paths:
      - "pc/endvr-host/**"
      - ".github/workflows/endvr-pc-host.yml"
  workflow_dispatch:

jobs:
  test:
    name: Python host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host package
        working-directory: pc/endvr-host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        working-directory: pc/endvr-host
        run: python -m unittest discover -s tests -v
