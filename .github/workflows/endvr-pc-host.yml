name: EndVR PC Host and SteamVR Driver

on:
  push:
    branches: [main]
    paths:
      - "pc/endvr-host/**"
      - "pc/steamvr-driver/**"
      - ".github/workflows/endvr-pc-host.yml"
  pull_request:
    paths:
      - "pc/endvr-host/**"
      - "pc/steamvr-driver/**"
      - ".github/workflows/endvr-pc-host.yml"
  workflow_dispatch:

jobs:
  host-tests:
    name: Python host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host package
        working-directory: pc/endvr-host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        working-directory: pc/endvr-host
        run: python -m unittest discover -s tests -v

  steamvr-driver-build:
    name: SteamVR driver compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S pc/steamvr-driver -B build/endvr-driver -DCMAKE_BUILD_TYPE=Release
      - name: Build driver
        run: cmake --build build/endvr-driver --config Release --parallel
