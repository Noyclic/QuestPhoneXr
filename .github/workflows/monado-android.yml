name: Monado Android Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monado-android.yml"
      - "runtime/monado-source.txt"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monado-android-runtime
  cancel-in-progress: true

jobs:
  build-monado-out-of-process:
    name: Build Monado Android Runtime (arm64 target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Monado Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools libeigen3-dev meson pkg-config python3 unzip wget
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Clone upstream Monado
        run: |
          git clone --depth 1 --branch main https://gitlab.freedesktop.org/monado/monado.git monado
          git -C monado rev-parse HEAD | tee monado-source-revision.txt

      - name: Configure Android SDK paths
        run: |
          cat > monado/local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/26.3.11579264
          EOF

      - name: Prepare upstream build
        run: |
          mkdir -p "$RUNNER_TEMP/monado-bin"
          cat > "$RUNNER_TEMP/monado-bin/ninja" <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/ninja -j4 "$@"
          EOF
          chmod +x "$RUNNER_TEMP/monado-bin/ninja"
          echo "$RUNNER_TEMP/monado-bin" >> "$GITHUB_PATH"
          echo "MAKEFLAGS=-j4" >> "$GITHUB_ENV"

      - name: Build out-of-process Android runtime
        working-directory: monado
        env:
          GRADLE_ARGS: "-Porg.gradle.daemon=false"
        run: ./gradlew --no-daemon --max-workers 4 clean assembleOutOfProcessDebug

      - name: Validate APK signature and Android package metadata
        run: |
          set -euo pipefail
          APK="$(find monado/src/xrt/targets/openxr_android/build/outputs/apk/outOfProcess -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee monado-apk-badging.txt
          grep -q "package: name='org.freedesktop.monado.openxr_runtime.out_of_process'" monado-apk-badging.txt
          grep -q "sdkVersion:'26'" monado-apk-badging.txt
          grep -q "arm64-v8a" monado-apk-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee monado-manifest-tree.txt
          grep -q "org.khronos.openxr.OpenXRRuntimeService" monado-manifest-tree.txt
          grep -q "org.khronos.openxr.OpenXRRuntime.SoFilename" monado-manifest-tree.txt
          grep -q "org.khronos.openxr.OpenXRRuntime.MajorVersion" monado-manifest-tree.txt
          grep -q "libopenxr_monado.so" monado-manifest-tree.txt

      - name: Collect runtime APK and source revision
        run: |
          set -euo pipefail
          APK="$(find monado/src/xrt/targets/openxr_android/build/outputs/apk/outOfProcess -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p monado-runtime-artifact
          cp "$APK" monado-runtime-artifact/Monado-Android-outOfProcess-debug.apk
          cp monado-source-revision.txt monado-runtime-artifact/MONADO_COMMIT.txt
          ls -lh monado-runtime-artifact

      - name: Upload Monado Runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: Monado-Android-outOfProcess-debug
          path: monado-runtime-artifact/*
          if-no-files-found: error
          retention-days: 14
